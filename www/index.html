<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phi</title>
<style>
  /* IBM Plex Sans Bold -- the exact same file (and weight -- see ui.c's
     draw_branding_bar: the "Phi" pill specifically uses g_ui.font_bold,
     IBMPlexSans-Bold.ttf, not the BoldItalic "Float64" pill sits next to)
     the in-canvas branding bar renders "Phi" with, so the loading
     screen's own title matches it exactly rather than approximating with
     a system font. Served from the real project-root assets/fonts/ the
     C-side font.c already loads from -- one real file, not two. */
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/assets/fonts/IBMPlexSans-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #loading {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    gap: 28px;
  }
  #loading-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: bold;
    font-size: 2.8rem;
    letter-spacing: 0.35em;
    color: #ffffff;
    text-shadow: 0 0 40px #00bfff66;
    user-select: none;
  }
  #loading-bar-wrap {
    width: min(420px, 72vw);
    height: 6px;
    background: #1a1a22;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 0 1px #00bfff33;
  }
  #loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00bfff, #87ceeb);
    border-radius: 3px;
    transition: width 0.18s ease-out;
    box-shadow: 0 0 10px #00bfff88;
  }
  #loading-status {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: #00bfff;
    opacity: 0.55;
    min-height: 1em;
    text-transform: uppercase;
  }
}
</style>
</head>
<body>

<div id="loading">
  <div id="loading-title">PHI</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-status">Initialising...</div>
</div>

<canvas id="canvas"></canvas>

<script>
// Resize canvas to window
function resizeCanvas() {
  var c = document.getElementById('canvas');
  c.width  = window.innerWidth;
  c.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);


// RMB opens the Scene panel's context menu (see main.c) — suppress the
// browser's own context menu so it doesn't appear underneath it.
document.getElementById('canvas').addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

// MMB drives Blender-style Scene-panel orbit/pan (see input.c/main.c).
// input.c's own mousedown/mouseup handlers already return EM_TRUE
// (Emscripten's own "return true to preventDefault" convention for
// html5.h callbacks), which should be enough on its own -- but Chrome/
// Firefox's middle-click autoscroll mode (the little scroll-icon cursor)
// has been unreliable to suppress that way alone in practice across
// browsers, since some fire a separate 'auxclick' event for the middle
// button that a 'mousedown' preventDefault doesn't necessarily cover.
// Belt-and-suspenders: an explicit JS-level listener on both events,
// registered {passive:false} since a passive listener can't call
// preventDefault at all.
document.getElementById('canvas').addEventListener('mousedown', function(e) {
  if (e.button === 1) e.preventDefault();
}, {passive: false});
document.getElementById('canvas').addEventListener('auxclick', function(e) {
  if (e.button === 1) e.preventDefault();
}, {passive: false});

// Loading bar helpers
var _loadBar    = null;
var _loadStatus = null;
function _setLoadProgress(pct, text) {
  if (!_loadBar)    _loadBar    = document.getElementById('loading-bar');
  if (!_loadStatus) _loadStatus = document.getElementById('loading-status');
  if (_loadBar)    _loadBar.style.width = Math.min(100, pct) + '%';
  if (_loadStatus) _loadStatus.textContent = text || '';
}

// Emscripten module config
var Module = {
  canvas: (function() { return document.getElementById('canvas'); })(),

  // Called by Emscripten with human-readable status strings during load
  setStatus: function(text) {
    if (!text) return;
    // Emscripten emits strings like "Downloading data... (x/y)"
    var match = text.match(/\((\d+)\/(\d+)\)/);
    if (match) {
      var pct = Math.round(parseInt(match[1]) / parseInt(match[2]) * 90);
      _setLoadProgress(pct, text.replace(/\s*\(.*\)/, '').trim());
    } else {
      _setLoadProgress(null, text);  // keep bar where it is, just update text
    }
  },

  // Called as async dependencies resolve (compilation, wasm instantiation, etc.)
  monitorRunDependencies: function(left) {
    // left counts down to 0 as deps finish; map to 90–99% range
    if (left === 0) {
      _setLoadProgress(99, 'Starting...');
    } else {
      // nudge bar forward while deps drain
      var bar = document.getElementById('loading-bar');
      if (bar) {
        var cur = parseFloat(bar.style.width) || 0;
        // advance at most 2% per dep resolved, stay ≤ 90
        _setLoadProgress(Math.min(90, cur + 2), 'Compiling...');
      }
    }
  },

  onRuntimeInitialized: function() {
    _setLoadProgress(100, 'Ready');
    /* Dismiss the loading screen straight into the editor -- no gating
     * overlay to click through first. */
    setTimeout(function() {
      document.getElementById('loading').style.display = 'none';
    }, 320);
    // WebSocket connection is initiated from C (main.c EM_ASM block)
  },
  print:    function(t) { console.log('[wasm]', t); },
  printErr: function(t) { console.warn('[wasm]', t); },
  locateFile: function(path) { return '/' + path; }
};
</script>
<script src="/game.js"></script>

</body>
</html>
